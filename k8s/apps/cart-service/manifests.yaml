apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: cart-service
    app.kubernetes.io/part-of: ecommerce-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cart-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart-service
        app.kubernetes.io/part-of: ecommerce-app
    spec:
      containers:
        - name: cart-service
          image: local.registry/cart-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: REDIS_URI
              value: "redis-ext-svc:6379"
            - name: CART_TTL_HOURS
              value: "168"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service-svc
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: cart-service
    app.kubernetes.io/part-of: ecommerce-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cart-service
  ports:
    - port: 80
      targetPort: 8082
      protocol: TCP
