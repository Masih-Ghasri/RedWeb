apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cart-route
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: cart-service
    app.kubernetes.io/part-of: ecommerce-app
spec:
  parentRefs:
    - name: redweb-gateway
      namespace: ecommerce
  hostnames:
    - "api.redweb.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/carts
      backendRefs:
        - name: cart-service-svc
          port: 80
