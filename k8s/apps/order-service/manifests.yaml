apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: ecommerce-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
    spec:
      containers:
        - name: order-service
          image: local.registry/order-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: POSTGRES_DSN
              value: "host=postgres-ext-svc user=postgres password=postgres dbname=order_db port=5432 sslmode=disable"
            - name: REDIS_URI
              value: "redis-ext-svc:6379"
            - name: RABBITMQ_URI
              value: "amqp://guest:guest@rabbitmq-ext-svc:5672/"
            - name: CART_SERVICE_URL
              value: "http://cart-service-svc:80"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service-svc
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: ecommerce-app
spec:
  selector:
    app.kubernetes.io/name: order-service
  ports:
    - port: 80
      targetPort: 8081
      protocol: TCP