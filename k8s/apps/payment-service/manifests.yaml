apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: ecommerce-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
    spec:
      containers:
        - name: payment-service
          image: local.registry/payment-service:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DSN
              value: "host=postgres-ext-svc user=postgres password=postgres dbname=payment_db port=5432 sslmode=disable"
            - name: REDIS_URI
              value: "redis-ext-svc:6379"
            - name: RABBITMQ_URI
              value: "amqp://guest:guest@rabbitmq-ext-svc:5672/"
            - name: BANK_GATEWAY_URL
              value: "http://mock-bank-svc:9090"