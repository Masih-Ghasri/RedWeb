apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-bank
  labels:
    app.kubernetes.io/name: mock-bank
    app.kubernetes.io/part-of: ecommerce-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-bank
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-bank
    spec:
      containers:
        - name: mock-bank
          image: local.registry/mock-bank:v1
          imagePullPolicy: IfNotPresent  
          ports:
            - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: mock-bank-svc
  labels:
    app.kubernetes.io/name: mock-bank
    app.kubernetes.io/part-of: ecommerce-app
spec:
  selector:
    app.kubernetes.io/name: mock-bank
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP