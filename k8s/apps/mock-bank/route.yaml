apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mock-bank-route
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: mock-bank
    app.kubernetes.io/part-of: ecommerce-app
spec:
  parentRefs:
    - name: redweb-gateway
      namespace: ecommerce
  hostnames:
    - "api.redweb.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pay
      backendRefs:
        - name: mock-bank-svc
          port: 9090
