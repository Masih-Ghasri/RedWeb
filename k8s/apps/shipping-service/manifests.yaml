apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service
  labels:
    app.kubernetes.io/name: shipping-service
    app.kubernetes.io/part-of: ecommerce-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shipping-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipping-service
    spec:
      containers:
        - name: shipping-service
          image: local.registry/shipping-service:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DSN
              value: "host=postgres-ext-svc user=postgres password=postgres dbname=shipping_db port=5432 sslmode=disable"
            - name: RABBITMQ_URI
              value: "amqp://guest:guest@rabbitmq-ext-svc:5672/"