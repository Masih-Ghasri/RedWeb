apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redweb-ecommerce
  namespace: argocd 
spec:
  project: default
  
  source:
    repoURL: 'https://github.com/Masih-Ghasri/RedWeb.git' 
    targetRevision: HEAD 
    path: k8s 
    directory:
      recurse: true 
      
  destination:
    server: 'https://kubernetes.default.svc' 
    namespace: ecommerce 
    
  syncPolicy:
    automated:
      prune: true    
      selfHeal: true  
    syncOptions:
      - CreateNamespace=true  