apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-ext-svc
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: ecommerce-infrastructure
spec:
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: rabbitmq-ext-svc
subsets:
  - addresses:
      - ip: 192.168.0.6
    ports:
      - name: amqp
        port: 5672