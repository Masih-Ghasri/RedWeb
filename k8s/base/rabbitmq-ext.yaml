apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-ext-svc
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: RedWeb-infrastructure
spec:
  type: ExternalName
  externalName: host.docker.internal
---
apiVersion: v1
kind: Endpoints
metadata:
  name: rabbitmq-ext-svc
subsets:
  - addresses:
      - ip: 192.168.0.6
    ports:
      - name: amqp
        port: 5672