apiVersion: v1
kind: Service
metadata:
  name: redis-ext-svc
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: redis-ext-svc
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: redis
subsets:
  - addresses:
      - ip: 192.168.0.6
    ports:
      - port: 6379