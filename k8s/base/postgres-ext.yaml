apiVersion: v1
kind: Service
metadata:
  name: postgres-ext-svc
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres-ext-svc
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: postgres
subsets:
  - addresses:
      - ip: 192.168.0.6
    ports:
      - port: 5432